services:
  - type: web
    name: hr-assist
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Langchain_HR_example:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: ""
